name: Sync Hetal jobs

on:
  schedule:
    # Every six hours, plus 12:10 a.m. Eastern Standard Time so a new weekday starts closed or open.
    - cron: "10 */6 * * *"
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-hetal-jobs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run sync-jobs
      - name: Publish updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "Sheet produced no job changes."
            exit 0
          fi
          git commit -m "Sync open jobs from the Hetal sheet."
          git push
